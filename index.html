<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterfly</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #111813; }
      canvas { display: block; width: 100%; height: 100%; }
      .image-picker {
        position: fixed;
        z-index: 1;
        right: 50%;
        bottom: max(1rem, env(safe-area-inset-bottom));
        transform: translateX(50%);
        display: flex;
        align-items: center;
        gap: 0.85rem;
        width: min(22rem, calc(100vw - 2rem));
        padding: 0.75rem 1rem;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 999px;
        background: rgb(17 24 19 / 88%);
        color: #f2f5ed;
        font: 500 0.9rem/1 system-ui, sans-serif;
        backdrop-filter: blur(10px);
      }
      .image-picker input[type="range"] { flex: 1; accent-color: #b9d978; }
      .image-picker output { min-width: 1ch; text-align: center; }
      .xerfly-gallery {
        position: fixed;
        z-index: 1;
        top: max(1rem, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 0.05rem;
        width: 98vw;
        pointer-events: none;
      }
      .xerfly-card {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 16%);
        background: rgb(17 24 19 / 88%);
        color: #f2f5ed;
        text-align: center;
        font: 500 clamp(0.5rem, 1.1vw, 0.75rem)/1.2 system-ui, sans-serif;
        backdrop-filter: blur(10px);
      }
      .xerfly-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 0;
      }
      .xerfly-card figcaption {
        padding: 0.35rem 0.2rem;
        overflow-wrap: anywhere;
      }
      .xerfly-toggle {
        position: absolute;
        z-index: 1;
        top: 0.35rem;
        left: 0.35rem;
        display: grid;
        width: 1.5rem;
        height: 1.5rem;
        place-items: center;
        cursor: pointer;
        pointer-events: auto;
      }
      .xerfly-toggle input {
        width: 1.15rem;
        height: 1.15rem;
        margin: 0;
        appearance: none;
        border: 2px solid #111;
        border-radius: 0;
        background: #fff;
        cursor: pointer;
      }
      .xerfly-toggle input:checked {
        background: #111;
        box-shadow: inset 0 0 0 3px #fff;
      }
      @media (max-width: 600px) {
        .xerfly-gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.05rem; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
        }
      }
    </script>
  </head>
  <body>
    <section class="xerfly-gallery" aria-label="Latest xerfly images">
      <figure class="xerfly-card"><img src="./xerflies/boreal-xerfly/Screenshot 2026-10-28 at 9.40.44%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show boreal-xerfly"><input type="checkbox" data-butterfly="0" checked></label><figcaption>boreal-xerfly</figcaption></figure>
      <figure class="xerfly-card"><img src="./xerflies/desert-xerfly/Screenshot 2026-10-28 at 9.38.49%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show desert-xerfly"><input type="checkbox" data-butterfly="1" checked></label><figcaption>desert-xerfly</figcaption></figure>
      <figure class="xerfly-card"><img src="./xerflies/fulgid-xerfly/Screenshot 2026-10-28 at 9.43.15%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show fulgid-xerfly"><input type="checkbox" data-butterfly="2" checked></label><figcaption>fulgid-xerfly</figcaption></figure>
      <figure class="xerfly-card"><img src="./xerflies/gloaming-xerfly/Screenshot 2026-10-28 at 9.37.09%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show gloaming-xerfly"><input type="checkbox" data-butterfly="3" checked></label><figcaption>gloaming-xerfly</figcaption></figure>
      <figure class="xerfly-card"><img src="./xerflies/juniper-xerfly/Screenshot 2026-10-28 at 9.40.08%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show juniper-xerfly"><input type="checkbox" data-butterfly="4" checked></label><figcaption>juniper-xerfly</figcaption></figure>
      <figure class="xerfly-card"><img src="./xerflies/silt-xerfly/Screenshot 2026-10-28 at 9.38.05%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show silt-xerfly"><input type="checkbox" data-butterfly="5" checked></label><figcaption>silt-xerfly</figcaption></figure>
      <figure class="xerfly-card"><img src="./xerflies/sintered-xerfly/Screenshot 2026-10-28 at 9.42.33%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show sintered-xerfly"><input type="checkbox" data-butterfly="6" checked></label><figcaption>sintered-xerfly</figcaption></figure>
      <figure class="xerfly-card"><img src="./xerflies/verdant-xerfly/Screenshot 2026-10-28 at 9.41.32%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show verdant-xerfly"><input type="checkbox" data-butterfly="7" checked></label><figcaption>verdant-xerfly</figcaption></figure>
    </section>
    <label class="image-picker" for="butterfly-image">
      <span id="butterfly-stage">Pupa</span>
      <input id="butterfly-image" type="range" min="1" max="7" step="1" value="1" aria-label="Butterfly life stage">
    </label>
    <script type="module" src="./main.js"></script>
  </body>
</html>
