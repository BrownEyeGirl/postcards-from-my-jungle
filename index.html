<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ཐི⋆lepidopterarium⋆ཋྀ</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #fff; font-family: "Courier New", Courier, monospace; }
      body::after {
        position: fixed;
        z-index: 2;
        inset: 0;
        border: 0.35rem solid #6b442f;
        content: "";
        pointer-events: none;
      }
      canvas { display: block; width: 100%; height: 100%; }
      .page-header {
        position: fixed;
        z-index: 1;
        top: max(0.65rem, env(safe-area-inset-top));
        left: 50%;
        width: calc(100% - 2rem);
        transform: translateX(-50%);
        padding: 0.4rem 0.75rem 0.5rem;
        color: #6b442f;
        text-align: center;
        font-size: clamp(1rem, 2.2vw, 1.6rem);
        font-weight: 400;
        line-height: 1.2;
      }
      .page-header h1 { margin: 0; font-size: inherit; font-weight: 700; }
      .page-header p { margin: 0.2rem 0 0; color: #a88d7d; font-size: 0.65em; line-height: 1.2; }
      .image-picker {
        position: fixed;
        z-index: 1;
        right: 50%;
        bottom: max(1rem, env(safe-area-inset-bottom));
        transform: translateX(50%);
        display: flex;
        align-items: center;
        gap: 0.6rem;
        width: min(22rem, calc(100vw - 2rem));
        padding: 0.4rem 0;
        color: #6b442f;
        font: 500 0.9rem/1 "Courier New", Courier, monospace;
      }
      .image-picker input[type="range"] { flex: 1; accent-color: #6b442f; }
      .image-picker span { flex: 0 0 auto; }
      .xerfly-gallery {
        position: fixed;
        z-index: 1;
        top: max(4rem, calc(env(safe-area-inset-top) + 3rem));
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 0.05rem;
        width: 98vw;
        pointer-events: none;
      }
      .xerfly-card {
        position: relative;
        min-width: 0;
        overflow: hidden;
        color: #6b442f;
        text-align: center;
        font: 400 clamp(0.55rem, 1.1vw, 0.75rem)/1.2 "Courier New", Courier, monospace;
      }
      .xerfly-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 0;
      }
      .xerfly-card figcaption {
        padding: 0.25rem 0.1rem;
        font-weight: 700;
      }
      .sound-buttons {
        display: grid;
        gap: 0.2rem;
        width: 100%;
        padding: 0 0 0.3rem;
        pointer-events: auto;
      }
      .sound-title { padding-bottom: 0.1rem; }
      .sound-control { display: grid; grid-template-rows: auto auto; justify-items: center; gap: 0.1rem; width: 100%; }
      .sound-transcription { display: none; margin: 0 0 0.2rem; font-style: italic; line-height: 1.2; overflow-wrap: anywhere; }
      .sound-transcription.is-playing { display: block; }
      .sound-buttons button {
        padding: 0.15rem 0.3rem;
        border: 1px solid #6b442f;
        border-radius: 0;
        background: transparent;
        color: #6b442f;
        font: inherit;
        cursor: pointer;
      }
      .sound-control input[type="range"] { display: block; width: 100%; min-width: 0; margin: 0; accent-color: #6b442f; cursor: pointer; }
      .xerfly-toggle {
        position: absolute;
        z-index: 1;
        top: 0.35rem;
        left: 0.35rem;
        display: grid;
        width: 1.5rem;
        height: 1.5rem;
        place-items: center;
        cursor: pointer;
        pointer-events: auto;
      }
      .xerfly-toggle input {
        width: 1.15rem;
        height: 1.15rem;
        margin: 0;
        appearance: none;
        border: 2px solid #6b442f;
        border-radius: 0;
        background: #fff;
        cursor: pointer;
      }
      .xerfly-toggle input:checked {
        background: #6b442f;
        box-shadow: inset 0 0 0 3px #fff;
      }
      @media (max-width: 600px) {
        .xerfly-gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.05rem; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
        }
      }
    </script>
  </head>
  <body>
    <header class="page-header"><h1>ཐི⋆lepidopterarium⋆ཋྀ</h1><p>Skyla Trousdale - CART 498</p></header>
    <section class="xerfly-gallery" aria-label="Latest xerfly images">
      <figure class="xerfly-card"><img src="./xerflies/boreal-xerfly/Screenshot 2026-10-28 at 9.40.44%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show boreal-xerfly"><input type="checkbox" data-butterfly="0" checked></label><figcaption>boreal-<br>xerfly</figcaption><div class="sound-buttons" aria-label="Boreal sounds"><div class="sound-title">sound:</div><div class="sound-control"><button type="button" data-audio="boreal-young">play young</button><input type="range" min="0" max="100" value="0" step="0.1" data-progress="boreal-young" aria-label="young sound progress"></div><div class="sound-transcription" aria-label="Phonetic rendering of young sound">"Brru-lee, vhoo-uh, Rrrinn!"</div><div class="sound-control"><button type="button" data-audio="boreal-old">play old</button><input type="range" min="0" max="100" value="0" step="0.1" data-progress="boreal-old" aria-label="old sound progress"></div><div class="sound-transcription" aria-label="Phonetic rendering of old sound">"Hrrr-oom, vah-lee, Thumm!"</div></div><audio id="boreal-young" src="./sounds/boreal_young.wav" preload="metadata"></audio><audio id="boreal-old" src="./sounds/boreal_old.wav" preload="metadata"></audio></figure>

      <figure class="xerfly-card"><img src="./xerflies/gloaming-xerfly/Screenshot 2026-10-28 at 9.37.09%E2%80%AFPM.png" alt=""><label class="xerfly-toggle" aria-label="Show gloaming-xerfly"><input type="checkbox" data-butterfly="3" checked></label><figcaption>gloaming-<br>xerfly</figcaption><div class="sound-buttons" aria-label="Gloaming sounds"><div class="sound-title">sound:</div><div class="sound-control"><button type="button" data-audio="gloaming-young">play young</button><input type="range" min="0" max="100" value="0" step="0.1" data-progress="gloaming-young" aria-label="young sound progress"></div><div class="sound-transcription" aria-label="Phonetic rendering of young sound">"Vrrr-oww, zhee-uh, Mmm-rrr-ow!"</div><div class="sound-control"><button type="button" data-audio="gloaming-old">play old</button><input type="range" min="0" max="100" value="0" step="0.1" data-progress="gloaming-old" aria-label="old sound progress"></div><div class="sound-transcription" aria-label="Phonetic rendering of old sound">"Hmmm-vah, rrr-eh-eh, Zhummm!"</div></div><audio id="gloaming-young" src="./sounds/gloaming_young.wav" preload="metadata"></audio><audio id="gloaming-old" src="./sounds/gloaming_old.wav" preload="metadata"></audio></figure>
